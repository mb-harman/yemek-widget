name: Menü Güncelle

on:
  schedule:
    # Her ayın 1-5'i (yeni liste geç yüklenirse yakalasın) - UTC 04:00 = TR 07:00
    - cron: "0 4 1-5 * *"
    # Her pazartesi (yedek)
    - cron: "0 4 * * 1"
  workflow_dispatch: # elle çalıştırma butonu

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright kur
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Menüyü çek
        run: python scrape.py

      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menu.json widget.json
          git diff --cached --quiet || (git commit -m "Menü güncellendi" && git push)
